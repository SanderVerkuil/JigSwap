name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI writes to GitHub (the pnpm and Turborepo caches use the
# Actions runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

# A newer push to the same PR branch supersedes in-flight runs; pushes to main
# always run to completion so every main commit has a CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm before setup-node so its pnpm cache can resolve the store. Version is
      # read from the root package.json "packageManager" field (pnpm@11.5.2).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist Turborepo's local task cache between runs so unchanged packages are replayed.
      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm run format:check

      # Convex _generated/* is committed, so no deployment or secrets are needed here.
      # arch:check enforces the DDD/hexagonal boundaries via dependency-cruiser.
      # bundle:check fails when a route's first-load JS/CSS grows past apps/web/bundle-budget.json.
      - name: Verify (lint, type-check, test, build, bundle:check, arch:check)
        run: pnpm exec turbo run lint type-check test build bundle:check arch:check --concurrency=4
