name: Convex Deploy

# Convex backend deploys from CI:
#   - dev: tracks main only — every push to main updates the single shared development
#     deployment. Pull requests no longer deploy here; each PR gets its own isolated
#     preview deployment instead (see convex-preview.yml — preview deployments are
#     available on every Convex plan, including Free/Starter).
#   - production: only after the CI workflow succeeds on main (workflow_run gate), so prod
#     never deploys code that failed lint/type-check/test/build.
# _generated/* is committed, so a deploy only needs the deploy-key secrets.
# After each push, `whatsNew/publishPending` starts the What's new notification fan-out (idempotent).
# Preview deployments (convex-preview.yml) deliberately skip it: they are seeded from a dev snapshot
# and are throwaway, so notifying that copied member list would only add noise.
#
# `npx convex deploy` only targets production/preview, so the dev deployment is pushed with
# `npx convex dev --once` (a single non-interactive push), selected by a dev deploy key.
#
# Both pushes pass `--typecheck enable`: a type error in packages/backend/convex (tests
# included, per convex/tsconfig.json) fails the deploy. The CLI default `try` silently
# skips the check when packages/backend has no local `typescript`.
#
# Stale-commit guard: each job first checks that the commit it is about to deploy is still the
# tip of main, and skips every later step (with a notice; the job still succeeds) if not. CI runs
# for consecutive main commits can finish out of order, and the prod concurrency group queues
# runs without ordering them by commit, so an older commit's run could otherwise deploy over a
# newer one. The newer commit's own run deploys it. A re-run of an old run skips the same way.
# If the tip of main can't be read, the job fails without deploying (visible, safe to re-run).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  dev:
    name: Deploy dev deployment
    # Direct trigger only (pushes to main); the workflow_run event is for prod.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One shared dev deployment: serialize deploys and let a newer main push supersede an
    # in-flight one, so dev always converges on the latest main.
    concurrency:
      group: convex-dev-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no longer the tip of main
        id: guard
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          tip_line=$(git ls-remote --exit-code origin refs/heads/main) || {
            echo "::error title=Stale-commit guard::Could not read the tip of main (git ls-remote failed), so ${DEPLOY_SHA} was not deployed. Re-run this job."
            exit 1
          }
          tip=${tip_line%%[[:space:]]*}
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "${DEPLOY_SHA} is the tip of main; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Stale deploy skipped::Skipping deploy: ${DEPLOY_SHA} is no longer the tip of main (${tip}); a newer commit's deploy will run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy to dev
        if: steps.guard.outputs.deploy == 'true'
        working-directory: packages/backend
        env:
          # A dev deploy key (format "dev:<name>|...") selects the development deployment.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: pnpm exec convex dev --once --typecheck enable

      # Start the whats_new notification fan-out for notify:true What's new entries this deploy
      # shipped. Idempotent (one whatsNewPublications row per entry), so it is safe on every
      # deploy and a no-op when nothing is pending. The deploy key selects the same deployment.
      # Retried (4 attempts, 15s/30s/60s backoff) so one failed call doesn't fail an otherwise
      # successful deploy; the deploy step itself is never retried. Each attempt's output stays
      # in the log, and if every attempt fails the job fails with a warning annotation.
      - name: Publish pending What's new notifications
        if: steps.guard.outputs.deploy == 'true'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          set -o pipefail
          delays=(15 30 60)
          for attempt in 1 2 3 4; do
            echo "--- publishPending attempt ${attempt}/4"
            status=0
            pnpm exec convex run whatsNew/publishPending:publishPending || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "publishPending attempt ${attempt}/4 failed (exit ${status})"
            if [ "$attempt" -lt 4 ]; then
              delay=${delays[attempt - 1]}
              echo "Retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::warning title=publishPending failed::The Convex deploy succeeded, but whatsNew/publishPending failed after 4 attempts. publishPending is idempotent, so re-running this job is safe."
          exit 1

  production:
    name: Deploy production deployment
    # Only when the CI workflow completed successfully on main.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never cancel an in-flight production deploy; queue instead.
    concurrency:
      group: convex-prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs detached from the triggering commit; check out the exact SHA CI passed on.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip if no longer the tip of main
        id: guard
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip_line=$(git ls-remote --exit-code origin refs/heads/main) || {
            echo "::error title=Stale-commit guard::Could not read the tip of main (git ls-remote failed), so ${DEPLOY_SHA} was not deployed. Re-run this job."
            exit 1
          }
          tip=${tip_line%%[[:space:]]*}
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "${DEPLOY_SHA} is the tip of main; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Stale deploy skipped::Skipping deploy: ${DEPLOY_SHA} is no longer the tip of main (${tip}); a newer commit's deploy will run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy production
        if: steps.guard.outputs.deploy == 'true'
        working-directory: packages/backend
        env:
          # A production deploy key targets prod non-interactively (no confirmation prompt).
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: pnpm exec convex deploy --typecheck enable

      # Start the whats_new notification fan-out for notify:true What's new entries this deploy
      # shipped. Idempotent (one whatsNewPublications row per entry), so it is safe on every
      # deploy and a no-op when nothing is pending. The deploy key selects the same deployment.
      # Retried (4 attempts, 15s/30s/60s backoff) so one failed call doesn't fail an otherwise
      # successful deploy; the deploy step itself is never retried. Each attempt's output stays
      # in the log, and if every attempt fails the job fails with a warning annotation.
      - name: Publish pending What's new notifications
        if: steps.guard.outputs.deploy == 'true'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          set -o pipefail
          delays=(15 30 60)
          for attempt in 1 2 3 4; do
            echo "--- publishPending attempt ${attempt}/4"
            status=0
            pnpm exec convex run whatsNew/publishPending:publishPending || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "publishPending attempt ${attempt}/4 failed (exit ${status})"
            if [ "$attempt" -lt 4 ]; then
              delay=${delays[attempt - 1]}
              echo "Retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::warning title=publishPending failed::The Convex deploy succeeded, but whatsNew/publishPending failed after 4 attempts. publishPending is idempotent, so re-running this job is safe."
          exit 1
