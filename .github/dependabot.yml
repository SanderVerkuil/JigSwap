# Dependabot keeps the SHA-pinned GitHub Actions and the lockfile-pinned Vercel CLI current.
#
# Every `uses:` in .github/workflows is pinned to a full commit SHA with a `# vX.Y.Z` comment,
# so a moved or hijacked tag cannot change what runs in jobs that hold deploy keys. Dependabot
# reads the comment and bumps the SHA and the comment together. Minor and patch releases arrive
# as one grouped PR a week; each major release gets its own PR, because a major can change
# inputs or defaults and needs its own check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Leave a new release a week to be pulled or fixed before it is proposed here (a hijacked
    # release is usually caught within days).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # The Vercel CLI that vercel-preview.yml runs with VERCEL_TOKEN, installed with
  # `npm ci --ignore-scripts` from .github/vercel-cli/package-lock.json (outside the pnpm
  # workspace). A bump rewrites that lockfile; a major bump can change the deploy flags, so
  # run one labelled preview before merging it.
  #
  # This entry only bumps `vercel` itself. Because the lockfile is committed, GitHub also
  # raises Dependabot alerts for the CLI's transitive packages (when it landed, npm audit
  # counted 33 vulnerable packages: tar critical, 20 high, 12 moderate). Almost all sit behind
  # exact pins inside Vercel's own packages, so a security update cannot resolve them; they
  # clear when a CLI release moves those pins. audit.yml lists the same tree in every run.
  - package-ecosystem: npm
    directory: /.github/vercel-cli
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
