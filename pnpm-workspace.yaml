packages:
  - apps/*
  - packages/*

allowBuilds:
  "@clerk/shared": true
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

linkWorkspacePackages: true

# Pin zod: keep the whole workspace on one zod version that @hookform/resolvers and the
# zodResolver-based forms type-check against. Raised to 4.6.7 alongside resolvers 5.9.1.
# Pin less: it's an optional CSS-preprocessor peer of vite (unused here); 4.5.1 added a
# postinstall script that makes `pnpm install` exit non-zero.
# Pin eslint-plugin-react-hooks (oxlint runs it as a jsPlugin): keep the whole workspace
# on one version, so lint results don't depend on which copy resolves.
# 7.1.1's `set-state-in-effect`/`refs` findings are fixed.
overrides:
  zod: 4.6.7
  less: 4.4.0
  eslint-plugin-react-hooks: 7.1.1
  # Drop optional peers that eslint-module-utils / eslint-import-resolver-typescript
  # (used by the boundaries jsPlugin) would otherwise pull in. oxlint never loads them,
  # and @typescript-eslint/parser would keep a TypeScript 6 peer in the tree.
  "@typescript-eslint/parser": "-"
  eslint-plugin-import: "-"
  # Security patches for transitive deps flagged by Dependabot — each pins only
  # the vulnerable range to its first patched version (selective overrides).
  # Vite 8 accepts esbuild ^0.27.0 || ^0.28.0, so 0.28.1 is in range.
  # js-yaml is patched on both lines (3.15.2 and 4.3.2), so gray-matter keeps
  # its js-yaml v3 API and xmlbuilder2 stays on v4.
  # seroval and seroval-plugins use ~ instead of ^: TanStack declares ^1.6.7,
  # and the patched 1.6 line keeps SSR serialisation on the minor TanStack was
  # released against. A TanStack bump, not this override, moves them to 1.7.
  # The plugins move in lockstep with seroval itself.
  # webpack-dev-server is only an optional peer of @nx/webpack 23 (>=5.2.5), so
  # re-resolving dropped it — and its http-proxy-middleware 2.x / sockjs / uuid
  # subtree — from the lockfile entirely. Their overrides below stay as guards
  # so any future resolution lands on a patched version (uuid 11 still ships
  # CJS; only v13 dropped it).
  esbuild@<0.28.1: ^0.28.1
  form-data@<4.0.6: ^4.0.6
  tmp@<0.2.7: ^0.2.7
  ws@>=8.0.0 <8.21.0: ^8.21.0
  dompurify@<3.4.11: ^3.4.11
  postcss@<8.5.10: ^8.5.10
  qs@>=6.0.0 <6.16.1: ^6.16.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  http-proxy-middleware@>=3.0.0 <3.0.7: ^3.0.7
  http-proxy-middleware@>=0.16.0 <2.0.10: ^2.0.10
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  webpack-dev-server@>=5.0.0 <5.2.5: ^5.2.5
  uuid@<11.1.1: ^11.1.1
  seroval@>=1.5.5 <1.6.11: ~1.6.12
  seroval-plugins@>=1.5.5 <1.6.11: ~1.6.12
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  browserslist@>=4.0.0 <4.28.7: ^4.28.7
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  fflate@>=0.6.0 <0.6.11: ^0.6.11
  fflate@>=0.4.5 <0.4.9: ^0.4.9
  # Dev and build tooling: oxlint's boundaries jsPlugin (handlebars, and
  # brace-expansion via eslint-import-resolver-typescript), Stryker (qs,
  # brace-expansion), sass-embedded under vite (immutable) and @tailwindcss/node
  # (source-map-js).
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  handlebars@>=4.0.0 <4.7.10: ^4.7.10
  immutable@>=5.0.0 <5.1.8: ^5.1.8
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2

onlyBuiltDependencies:
  - "@clerk/shared"
  - "@parcel/watcher"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - "@vercel/speed-insights"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - "@clerk/backend@3.7.0 || 3.11.1 || 3.25.0"
  - "@clerk/react@6.9.1 || 6.12.0"
  - "@clerk/shared@4.17.1 || 4.25.0"
  - "@clerk/tanstack-react-start@1.4.2 || 1.4.14 || 1.7.3"
  - posthog-js@1.386.6 || 1.398.2
  - "@clerk/localizations@4.13.0"
  - "@react-email/render@2.1.1"
  - "@tanstack/react-router@1.170.45"
  - "@tanstack/react-start-client@1.168.43"
  - "@tanstack/react-start-rsc@0.1.64"
  - "@tanstack/react-start-server@1.167.51"
  - "@tanstack/react-start@1.169.3"
  - "@tanstack/router-core@1.171.38"
  - "@tanstack/router-generator@1.167.45"
  - "@tanstack/router-plugin@1.168.47"
  - "@tanstack/start-client-core@1.170.38"
  - "@tanstack/start-plugin-core@1.171.54"
  - "@tanstack/start-server-core@1.169.44"
  - "@tanstack/start-storage-context@1.167.40"
  - lucide-react@1.59.0

patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
